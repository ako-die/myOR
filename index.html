<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#32145f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>MyOR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#32145f;color:#241735}.splash{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.splashbox{position:relative;width:min(100%,520px)}.splashbox img{width:100%;display:block;border-radius:18px}.start{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:13px 42px;background:#fff;color:#32145f;font-weight:900;font-size:17px}.app{display:none;max-width:760px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#2b104f,#6f3fb4);color:#fff;border-radius:18px;padding:20px}.brand{font-size:28px;font-weight:900}.tag{font-size:13px;opacity:.85}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{padding:12px;border:1px solid #cdbde2;border-radius:11px;background:white;color:#32145f;font-weight:800}.tab.active{background:#6f3fb4;color:white}.panel{background:white;border:1px solid #ddd1ea;border-radius:16px;padding:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{position:relative}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field input{width:100%;padding:11px 42px 11px 11px;border:1px solid #cfc3dc;border-radius:9px;font-weight:bold}.clear-input{position:absolute;right:8px;bottom:7px;width:30px;height:30px;border:0;border-radius:50%;background:#e7e2ee;color:#32145f;font-weight:900;font-size:18px;cursor:pointer}.calc{margin-top:12px;padding:12px;background:#eee3fa;border-radius:10px;display:flex;justify-content:space-between}.totals{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.total{background:#32145f;color:#fff;border-radius:11px;padding:12px}.big{font-weight:900;margin-top:4px}.reset{width:100%;margin-top:10px;padding:10px;border:1px solid #cdbde2;border-radius:9px;background:#fff;color:#32145f;font-weight:bold}@media(max-width:520px){.grid,.totals{grid-template-columns:1fr}}
</style></head><body>
<div id="splash" class="splash"><div class="splashbox"><img src="splash.png" alt="MyOR"><button class="start" id="start">MULAI</button></div></div>
<main id="app" class="app"><header class="head"><div class="brand">MyOR</div><div class="tag">Kalkulator Operasional Rupiah & Valas</div></header>
<div class="tabs"><button class="tab active" id="t1">Nominal Rupiah</button><button class="tab" id="t2">Nominal Valas</button></div>
<section id="p1" class="panel"><h3>Menggunakan Nominal Rupiah</h3><div class="grid">
<label class="field">Nominal Rupiah<input id="rn" value="10.000.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="rn">×</button></label><label class="field">Kurs TT<input id="rk" value="16.700" inputmode="numeric"><button class="clear-input" type="button" data-clear="rk">×</button></label><label class="field">By FA / Valas<input id="rf" value="25" inputmode="numeric"><button class="clear-input" type="button" data-clear="rf">×</button></label><label class="field">Biaya OR<input id="rb" value="50.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="rb">×</button></label><label class="field">Value Today<input id="rv" value="30.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="rv">×</button></label><label class="field">Materai<input id="rm" value="10.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="rm">×</button></label></div>
<div class="calc"><span>Nominal VALAS</span><b id="rval"></b></div><div class="calc"><span>By FA</span><b id="rfar"></b></div><div class="totals"><div class="total">Total USD<div class="big" id="rusd"></div></div><div class="total">Total Rupiah<div class="big" id="rrp"></div></div></div><button class="reset" id="clearRp">HAPUS SEMUA</button><button class="reset" id="rr">RESET CONTOH</button></section>
<section id="p2" class="panel hidden"><h3>Menggunakan Nominal Valas</h3><div class="grid">
<label class="field">Nominal VALAS (USD)<input id="vn" value="5.300" inputmode="numeric"><button class="clear-input" type="button" data-clear="vn">×</button></label><label class="field">Kurs TT<input id="vk" value="16.700" inputmode="numeric"><button class="clear-input" type="button" data-clear="vk">×</button></label><label class="field">By FA / Valas<input id="vf" value="25" inputmode="numeric"><button class="clear-input" type="button" data-clear="vf">×</button></label><label class="field">Biaya OR<input id="vb" value="50.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="vb">×</button></label><label class="field">Value Today<input id="vv" value="30.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="vv">×</button></label><label class="field">Materai<input id="vm" value="10.000" inputmode="numeric"><button class="clear-input" type="button" data-clear="vm">×</button></label></div>
<div class="calc"><span>Nominal Rupiah</span><b id="vrp"></b></div><div class="calc"><span>By FA</span><b id="vfar"></b></div><div class="totals"><div class="total">Total USD<div class="big" id="vusd"></div></div><div class="total">Total Rupiah<div class="big" id="vtotal"></div></div></div><button class="reset" id="clearVal">HAPUS SEMUA</button><button class="reset" id="vr">RESET CONTOH</button></section></main>
<script>
const $=id=>document.getElementById(id);
const n=id=>{let s=($(id).value||'').replace(/\\./g,'').replace(/,/g,'.');let x=parseFloat(s);return Number.isFinite(x)?Math.max(0,x):0};
const rp=x=>'Rp '+x.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const us=x=>x.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' USD';function R(){let a=n('rn'),k=n('rk'),f=n('rf'),b=n('rb'),v=n('rv'),m=n('rm'),u=k?a/k:0,fr=f*k;$('rval').textContent=us(u);$('rfar').textContent=rp(fr);$('rusd').textContent=us(u+f);$('rrp').textContent=rp(a+fr+b+v+m)}
function V(){let u=n('vn'),k=n('vk'),f=n('vf'),b=n('vb'),v=n('vv'),m=n('vm'),r=u*k,fr=f*k;$('vrp').textContent=rp(r);$('vfar').textContent=rp(fr);$('vusd').textContent=us(u+f);$('vtotal').textContent=rp(r+fr+b+v+m)}
$('start').onclick=()=>{$('splash').style.display='none';$('app').style.display='block'};$('t1').onclick=()=>{$('t1').classList.add('active');$('t2').classList.remove('active');$('p1').classList.remove('hidden');$('p2').classList.add('hidden')};$('t2').onclick=()=>{$('t2').classList.add('active');$('t1').classList.remove('active');$('p2').classList.remove('hidden');$('p1').classList.add('hidden')};document.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{R();V()}));
document.querySelectorAll('.clear-input').forEach(b=>b.addEventListener('click',()=>{$(b.dataset.clear).value='';$(b.dataset.clear).focus();R();V()}));$('clearRp').onclick=()=>{['rn','rk','rf','rb','rv','rm'].forEach(id=>$(id).value='');R()};
$('rr').onclick=()=>{[['rn','10.000.000'],['rk','16.700'],['rf','25'],['rb','50.000'],['rv','30.000'],['rm','10.000']].forEach(a=>$(a[0]).value=a[1]);R()};V();
</script></body></html>
